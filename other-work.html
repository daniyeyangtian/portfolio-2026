<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>other work · yeyang dani tian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=31">
<style>
  /* Other Work: each project is a small browser window: a title bar with the three window
     buttons and one open tab (the project's name, its colour as the tab icon), an address bar,
     then the page: the project's picture and its one-line intro. Hovering a window brings it
     forward like the active window (the buttons light up). Each opens work.html?p=N; content
     lives in js/other-work.js. */
  .work { max-width: 960px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 48px) 80px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 24px; list-style: none; padding: 0; }
  .win {
    --bar: #e4e5e8; --tab: #fff;
    display: flex; flex-direction: column; height: 100%;
    border-radius: 12px; overflow: hidden; background: var(--tab);
    box-shadow: 0 0 0 1px rgba(20,25,35,.10), 0 6px 16px -6px rgba(20,25,35,.18);
    transition: transform .35s cubic-bezier(.3,1.3,.5,1), box-shadow .35s;
  }
  .win:hover, .win:focus-visible { transform: translateY(-4px); box-shadow: 0 0 0 1px rgba(20,25,35,.12), 0 16px 28px -10px rgba(20,25,35,.28); }
  .win:focus-visible { outline: 2px solid var(--ink-muted); outline-offset: 4px; }
  /* title bar: window buttons, then the tab */
  .win-bar { display: flex; align-items: flex-end; gap: 14px; height: 38px; padding: 0 10px 0 12px; background: var(--bar); }
  .win-dots { display: flex; gap: 6px; align-self: center; }
  .win-dots i { width: 10px; height: 10px; border-radius: 50%; background: #c9cace; transition: background .25s; }
  .win:hover .win-dots i:nth-child(1), .win:focus-visible .win-dots i:nth-child(1) { background: #ff5f57; }
  .win:hover .win-dots i:nth-child(2), .win:focus-visible .win-dots i:nth-child(2) { background: #febc2e; }
  .win:hover .win-dots i:nth-child(3), .win:focus-visible .win-dots i:nth-child(3) { background: #28c840; }
  .win-tab {
    position: relative; display: flex; align-items: center; gap: 7px; min-width: 0; flex: 0 1 auto; max-width: 78%;
    height: 30px; padding: 0 10px 0 11px; background: var(--tab); border-radius: 9px 9px 0 0;
    font: 500 12.5px/1 "Geist", sans-serif; color: #1f2226;
  }
  /* the tab flares into the page below it, like a real browser tab */
  .win-tab::before, .win-tab::after { content: ""; position: absolute; bottom: 0; width: 9px; height: 9px; }
  .win-tab::before { left: -9px; background: radial-gradient(circle at 0 0, transparent 9px, var(--tab) 9.5px); }
  .win-tab::after { right: -9px; background: radial-gradient(circle at 100% 0, transparent 9px, var(--tab) 9.5px); }
  .win-fav { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
  .win-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win-x { flex: none; margin-left: 4px; font-size: 13px; color: #8a8d93; }
  /* address bar */
  .win-url {
    display: flex; align-items: center; gap: 6px; margin: 6px 10px 0; height: 24px; padding: 0 10px;
    border-radius: 999px; background: #f1f2f4; font: 11px/1 "DM Mono", monospace; color: #6a6e74;
    white-space: nowrap; overflow: hidden;
  }
  .win-url b { font-weight: 400; color: #2a2d31; }
  /* the page */
  .win-page { display: flex; flex-direction: column; flex: 1; padding: 10px 10px 14px; }
  .thumb-img {
    aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden;
    background: #d8dadd center / cover no-repeat;
    display: grid; place-items: center; font: 12px "DM Mono", monospace; color: #696c70;
  }
  .win-sub { display: block; margin: 12px 2px 0; font-size: 13px; line-height: 1.45; color: #4b4f55; }
  .win-meta { display: block; margin: auto 2px 0; padding-top: 10px; font: 11px/1.4 "DM Mono", monospace; color: #696c70; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 24px 20px; } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .win, .win-dots i { transition: none; } .win:hover, .win:focus-visible { transform: none; } }
</style>
</head>
<body>

<nav class="site-nav" aria-label="Primary">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="other-work.html" aria-current="page">Other Work</a></li>
    <li><a href="about.html">About Me</a></li>
  </ul>
</nav>

<main class="work">
  <h1 class="visually-hidden">Other work</h1>
  <ul class="grid" id="grid"></ul>
</main>

<script src="js/nav.js?v=24"></script>
<script src="js/other-work.js?v=7"></script>
<script>
  const grid = document.getElementById("grid");
  grid.innerHTML = OTHER_WORK.map((w, i) => {
    const n = i + 1, thumb = `assets/other-work/${w.id}/thumb.jpg?v=2`;
    return `<li><a class="win" href="work.html?p=${n}" style="--accent:${w.accent}" aria-label="${w.title}: ${w.sub}">
      <span class="win-bar" aria-hidden="true">
        <span class="win-dots"><i></i><i></i><i></i></span>
        <span class="win-tab"><span class="win-fav"></span><span class="win-name">${w.title}</span><span class="win-x">×</span></span>
      </span>
      <span class="win-url" aria-hidden="true"><span>other-work / <b>${String(n).padStart(2, "0")}-${w.slug}</b></span></span>
      <span class="win-page">
        <span class="thumb-img" data-src="${thumb}">image</span>
        <span class="win-sub">${w.sub}</span>
        <span class="win-meta">${w.year} · ${w.tags.join(" · ")}</span>
      </span>
    </a></li>`;
  }).join("");
  // show a thumbnail once its image exists; until then the grey box says "image"
  grid.querySelectorAll(".thumb-img").forEach(box => {
    const img = new Image();
    img.onload = () => { box.style.backgroundImage = `url("${box.dataset.src}")`; box.textContent = ""; };
    img.src = box.dataset.src;
  });
</script>
</body>
</html>
