<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Dani Tian Portfolio 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=32">
<style>
  /* One Other Work project (work.html?p=1…5), shown in a browser window like the cards on
     other-work.html: a title bar whose five tabs are the five projects (the open one is white),
     an address bar with back / forward (previous / next project), then the project page
     (other/<n>.html) in the window. Switching tabs swaps the page in place and updates the
     address; the red window button closes the window, back to Other Work. The window's bars
     stay at the top while the page scrolls. Projects live in js/other-work.js. */
  .page { max-width: 1220px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 48px) 80px; }
  .browser {
    --bar: #e4e5e8; --tab: #fff;
    border-radius: 12px; background: var(--tab);
    box-shadow: 0 0 0 1px rgba(20,25,35,.10), 0 10px 30px -12px rgba(20,25,35,.22);
  }
  .b-chrome { position: sticky; top: 0; z-index: 5; border-radius: 12px 12px 0 0; background: var(--tab); }
  /* title bar: window buttons, then a tab per project */
  .b-bar { display: flex; align-items: flex-end; gap: 16px; height: 44px; padding: 0 12px 0 14px; background: var(--bar); border-radius: 12px 12px 0 0; }
  .b-dots { display: flex; gap: 7px; align-self: center; flex: none; }
  .b-dots > * { width: 12px; height: 12px; border-radius: 50%; }
  .b-close { position: relative; background: #ff5f57; }
  .b-dots i:nth-child(2) { background: #febc2e; }
  .b-dots i:nth-child(3) { background: #28c840; }
  /* the close button shows its × on hover / focus, as on a Mac */
  .b-close::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; font: 600 10px/1 system-ui, sans-serif; color: rgba(0,0,0,.55); opacity: 0; transition: opacity .15s; }
  .b-close:hover::after, .b-close:focus-visible::after { opacity: 1; }
  .b-close:focus-visible { outline: 2px solid var(--ink-muted); outline-offset: 2px; }
  .b-tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 1; height: 100%; }
  .b-tab {
    position: relative; display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-width: 0; max-width: 210px;
    height: 34px; padding: 0 12px; border-radius: 9px 9px 0 0;
    font: 500 13px/1 "Geist", sans-serif; color: #4b4f55; transition: background .2s, color .2s;
  }
  .b-tab:hover { background: rgba(255,255,255,.55); color: #1f2226; }
  .b-tab:focus-visible { outline: 2px solid var(--ink-muted); outline-offset: -2px; }
  /* thin dividers between tabs that aren't next to the open one */
  .b-tab:not([aria-current]) + .b-tab:not([aria-current])::before {
    content: ""; position: absolute; left: -2px; top: 9px; bottom: 9px; width: 1px; background: #c9cace;
  }
  .b-tab[aria-current] { background: var(--tab); color: #1f2226; z-index: 1; }
  /* the open tab flares into the page below it */
  .b-tab[aria-current]::before, .b-tab[aria-current]::after { content: ""; position: absolute; bottom: 0; width: 9px; height: 9px; }
  .b-tab[aria-current]::before { left: -9px; background: radial-gradient(circle at 0 0, transparent 9px, var(--tab) 9.5px); }
  .b-tab[aria-current]::after { right: -9px; background: radial-gradient(circle at 100% 0, transparent 9px, var(--tab) 9.5px); }
  .b-fav { flex: none; width: 11px; height: 11px; border-radius: 3px; background: var(--accent); }
  .b-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* address bar with back / forward */
  .b-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #ececee; }
  .b-nav { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #5f6368; transition: background .2s, color .2s; }
  .b-nav:hover { background: #f1f2f4; color: #1f2226; }
  .b-nav:focus-visible { outline: 2px solid var(--ink-muted); outline-offset: 1px; }
  .b-nav svg { width: 16px; height: 16px; }
  .b-url {
    flex: 1; min-width: 0; display: flex; align-items: center; height: 30px; margin-left: 4px; padding: 0 14px;
    border-radius: 999px; background: #f1f2f4; font: 12px/1 "DM Mono", monospace; color: #6a6e74; white-space: nowrap; overflow: hidden;
  }
  .b-url b { font-weight: 400; color: #2a2d31; }
  /* the page in the window */
  .b-view { overflow: hidden; border-radius: 0 0 12px 12px; }
  .b-view iframe { display: block; width: 100%; border: 0; transition: opacity .2s; }
  .b-view iframe.is-loading { opacity: 0; }
  .pager { display: flex; justify-content: space-between; margin-top: 48px; padding-top: 20px; border-top: 1px solid #e3e1e6; font-size: 14px; }
  .pager a { color: var(--ink-muted); transition: color .3s; }
  .pager a:hover { color: var(--ink); }
  .pager span { display: block; font: 11px "DM Mono", monospace; color: #73726f; }
  /* narrow screens: only the open tab shows its name; the others keep their colour icon */
  @media (max-width: 700px) {
    .b-bar { gap: 10px; padding: 0 8px 0 10px; }
    .b-dots { gap: 5px; } .b-dots > * { width: 10px; height: 10px; }
    .b-tab { flex: 0 0 auto; padding: 0 10px; }
    .b-tab:not([aria-current]) .b-name { display: none; }
    .b-tab[aria-current] { flex: 1 1 auto; }
    .b-nav { width: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { .b-view iframe, .b-tab, .b-close::after { transition: none; } }
</style>
</head>
<body>

<nav class="site-nav" aria-label="Primary">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="other-work.html" aria-current="page">Other Work</a></li>
    <li><a href="about.html">About Me</a></li>
  </ul>
</nav>

<main class="page">
  <div class="browser">
    <div class="b-chrome">
      <div class="b-bar">
        <span class="b-dots">
          <a class="b-close" href="other-work.html" aria-label="Close: back to Other Work"></a><i aria-hidden="true"></i><i aria-hidden="true"></i>
        </span>
        <nav class="b-tabs" id="tabs" aria-label="Other Work projects"></nav>
      </div>
      <div class="b-toolbar">
        <a class="b-nav" id="back" href="#" aria-label="Previous project"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></a>
        <a class="b-nav" id="fwd" href="#" aria-label="Next project"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></a>
        <span class="b-url" id="url" aria-hidden="true"></span>
      </div>
    </div>
    <div class="b-view"><iframe id="view" scrolling="no" title=""></iframe></div>
  </div>

  <nav class="pager" aria-label="More work">
    <a id="prev" href="#"><span>Previous</span><b></b></a>
    <a id="next" href="#" style="text-align:right"><span>Next</span><b></b></a>
  </nav>
</main>

<script src="js/nav.js?v=24"></script>
<script src="js/other-work.js?v=7"></script>
<script>
  const N = OTHER_WORK.length;
  const tabs = document.getElementById("tabs"), view = document.getElementById("view");
  const pad = n => String(n).padStart(2, "0");
  const wrap = n => ((n - 1 + N) % N) + 1;
  const pOf = u => Math.min(N, Math.max(1, parseInt(new URL(u, location.href).searchParams.get("p")) || 1));

  tabs.innerHTML = OTHER_WORK.map((w, i) =>
    `<a class="b-tab" href="work.html?p=${i + 1}" style="--accent:${w.accent}" title="${w.title}"><span class="b-fav"></span><span class="b-name">${w.title}</span></a>`).join("");

  // the page in the window: as tall as its content, scaled to the window's width
  // (`h` until the page reports its height; pages whose text was re-spaced grow a little)
  let n = 0, h = 0;
  const size = () => { view.style.height = Math.ceil(h * view.clientWidth / 1220) + "px"; };
  addEventListener("message", e => {
    if (e.source === view.contentWindow && e.data?.otherWorkHeight) { h = e.data.otherWorkHeight; size(); }
  });
  addEventListener("resize", size);
  view.addEventListener("load", () => view.classList.remove("is-loading"));

  const show = m => {
    if (m === n) return;
    n = m; const w = OTHER_WORK[n - 1];
    [...tabs.children].forEach((t, i) => i + 1 === n ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
    document.getElementById("url").innerHTML = `<span>other-work / <b>${pad(n)}-${w.slug}</b></span>`;
    view.title = w.title;
    view.classList.add("is-loading");
    // replace(), not a new src: a new src adds an entry to the browser's history, and Back would
    // then step the page in the window instead of switching the tab back
    const page = new URL(`other/${w.id}.html?v=3`, location.href).href;
    if (view.contentWindow?.location.href.startsWith(location.origin)) view.contentWindow.location.replace(page);
    else view.src = page;
    h = w.h; size();
    const set = (id, m2) => { const a = document.getElementById(id); a.href = `work.html?p=${m2}`; const b = a.querySelector("b"); if (b) b.textContent = OTHER_WORK[m2 - 1].title; };
    set("back", wrap(n - 1)); set("fwd", wrap(n + 1)); set("prev", wrap(n - 1)); set("next", wrap(n + 1));
  };

  // switching projects stays on this page: swap the window's page, keep the address in step
  const go = (m, e) => {
    if (e && (e.metaKey || e.ctrlKey || e.shiftKey || e.button)) return;   // new tab / window as usual
    e?.preventDefault();
    if (m === n) return;
    history.pushState({ p: m }, "", `work.html?p=${m}`);
    show(m);
    const top = document.querySelector(".browser").getBoundingClientRect().top;
    if (top < 0) scrollBy({ top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  };
  document.addEventListener("click", e => {
    const a = e.target.closest(".b-tab, #back, #fwd, #prev, #next");
    if (a) go(pOf(a.href), e);
  });
  addEventListener("popstate", () => show(pOf(location.href)));
  show(pOf(location.href));
</script>
</body>
</html>
